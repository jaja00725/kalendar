<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Plánovací kalendář</title>

  <style>
    :root {
      --bg: #f4f5f7;
      --panel: #ffffff;
      --border: #d9dde3;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;

      --jirka: #dbeafe;
      --jirka-border: #3b82f6;

      --martin: #fce7f3;
      --martin-border: #ec4899;

      --both: #dcfce7;
      --both-border: #22c55e;

      --external: #fef3c7;
      --external-border: #f59e0b;

      --danger: #ef4444;
      --success: #16a34a;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overscroll-behavior: none;
    }

    .app {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 100vh;
    }

    aside {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 20px;
      overflow-y: auto;
    }

    main {
      padding: 20px;
      overflow-x: auto;
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    input, select, button {
      width: 100%;
      min-height: 44px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
    }

    input, select {
      background: white;
      color: var(--text);
    }

    button {
      cursor: pointer;
      border: none;
      background: var(--primary);
      color: white;
      font-weight: bold;
      transition: background 0.2s, transform 0.1s;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.98);
    }

    button:hover {
      background: var(--primary-dark);
    }

    .secondary-btn {
      background: #e5e7eb;
      color: var(--text);
    }

    .secondary-btn:hover {
      background: #d1d5db;
    }

    .danger-btn {
      background: var(--danger);
      color: white;
      margin-top: 12px;
    }

    .danger-btn:hover {
      background: #dc2626;
    }

    .hint {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
      margin-top: 12px;
    }

    .selected-info {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e3a8a;
      font-size: 14px;
      line-height: 1.4;
    }

    .selected-info.active {
      display: block;
    }

    .task-list {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task {
      position: relative;
      padding: 10px 40px 10px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      cursor: grab;
      background: white;
      font-size: 14px;
      user-select: none;
      touch-action: manipulation;
    }

    .task:active {
      cursor: grabbing;
    }

    .task.selected {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
    }

    .task strong {
      display: block;
      margin-bottom: 4px;
      padding-right: 8px;
    }

    .task small {
      color: var(--muted);
    }

    .task.jirka {
      background: var(--jirka);
      border-left: 5px solid var(--jirka-border);
    }

    .task.martin {
      background: var(--martin);
      border-left: 5px solid var(--martin-border);
    }

    .task.both {
      background: var(--both);
      border-left: 5px solid var(--both-border);
    }

    .task.external {
      background: var(--external);
      border-left: 5px solid var(--external-border);
    }

    .delete-task-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      min-height: 28px;
      padding: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.35);
      font-size: 17px;
      line-height: 1;
      font-weight: bold;
    }

    .delete-task-btn:hover {
      background: var(--danger);
      color: white;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .calendar-header h1 {
      margin: 0;
      text-transform: capitalize;
      text-align: center;
      font-size: 28px;
    }

    .calendar-header button {
      width: auto;
      min-width: 130px;
    }

    .calendar-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 12px;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(150px, 1fr));
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      min-width: 1050px;
    }

    .weekday {
      background: #eef2ff;
      padding: 12px;
      font-weight: bold;
      text-align: center;
      color: #3730a3;
    }

    .day {
      background: white;
      min-height: 160px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      touch-action: manipulation;
    }

    .day.empty {
      background: #f3f4f6;
    }

    .day.over {
      outline: 3px dashed var(--primary);
      outline-offset: -6px;
    }

    .day.can-place {
      cursor: pointer;
    }

    .day.can-place:active {
      background: #eff6ff;
    }

    .day-header {
      font-weight: bold;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .day-header span:last-child {
      color: var(--muted);
      font-weight: normal;
      font-size: 12px;
    }

    .day-tasks {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .calendar-task {
      padding: 7px 28px 7px 7px;
      border-radius: 7px;
      font-size: 13px;
      position: relative;
      word-break: break-word;
    }

    .calendar-task.jirka {
      background: var(--jirka);
      border-left: 4px solid var(--jirka-border);
    }

    .calendar-task.martin {
      background: var(--martin);
      border-left: 4px solid var(--martin-border);
    }

    .calendar-task.both {
      background: var(--both);
      border-left: 4px solid var(--both-border);
    }

    .calendar-task.external {
      background: var(--external);
      border-left: 4px solid var(--external-border);
    }

    .calendar-task button {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      min-height: 22px;
      padding: 0;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.8);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 50%;
      font-weight: bold;
      line-height: 1;
    }

    .calendar-task button:hover {
      background: var(--danger);
      color: white;
    }

    .legend {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 20px;
      font-size: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-color {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .legend-color.jirka {
      background: var(--jirka);
      border-left: 5px solid var(--jirka-border);
    }

    .legend-color.martin {
      background: var(--martin);
      border-left: 5px solid var(--martin-border);
    }

    .legend-color.both {
      background: var(--both);
      border-left: 5px solid var(--both-border);
    }

    .legend-color.external {
      background: var(--external);
      border-left: 5px solid var(--external-border);
    }

    @media (max-width: 900px) {
      .app {
        display: block;
      }

      aside {
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 16px;
      }

      main {
        padding: 16px;
      }

      .calendar-header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--bg);
        padding: 8px 0;
      }

      .calendar-header h1 {
        font-size: 20px;
      }

      .calendar-header button {
        min-width: 48px;
        width: 48px;
        padding: 8px;
        font-size: 0;
      }

      #prevMonthBtn::before {
        content: "←";
        font-size: 20px;
      }

      #nextMonthBtn::before {
        content: "→";
        font-size: 20px;
      }

      .calendar {
        grid-template-columns: repeat(7, minmax(118px, 1fr));
        min-width: 826px;
      }

      .weekday {
        padding: 10px 6px;
        font-size: 13px;
      }

      .day {
        min-height: 132px;
        padding: 7px;
      }

      .task {
        cursor: pointer;
      }

      .hint {
        font-size: 13px;
      }
    }

    @media (max-width: 520px) {
      aside {
        padding: 14px;
      }

      main {
        padding: 12px;
      }

      .calendar {
        grid-template-columns: repeat(7, minmax(104px, 1fr));
        min-width: 728px;
      }

      .day {
        min-height: 122px;
      }

      .calendar-task {
        font-size: 12px;
      }

      .selected-info {
        position: sticky;
        top: 0;
        z-index: 10;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside>
      <h2>Úkoly</h2>

      <div class="form-group">
        <label for="taskName">Název úkolu</label>
        <input id="taskName" type="text" placeholder="Např. Analýza dat" />
      </div>

      <div class="form-group">
        <label for="taskPerson">Pro koho</label>
        <select id="taskPerson">
          <option value="jirka">Jirka</option>
          <option value="martin">Martin</option>
          <option value="both">Jirka + Martin</option>
          <option value="external">Externí osoba</option>
        </select>
      </div>

      <div class="form-group">
        <label for="taskAmount">Časová dotace / počet dnů</label>
        <input id="taskAmount" type="number" min="1" value="1" />
      </div>

      <button id="addTaskBtn">Přidat úkol</button>

      <p class="hint">
        Na počítači můžeš úkol přetáhnout do kalendáře.
        Na mobilu klepni na úkol a potom klepni na den.
      </p>

      <div class="selected-info" id="selectedInfo"></div>

      <div class="task-list" id="taskList"></div>

      <div class="legend">
        <h3>Legenda</h3>

        <div class="legend-item">
          <div class="legend-color jirka"></div>
          <span>Jirka</span>
        </div>

        <div class="legend-item">
          <div class="legend-color martin"></div>
          <span>Martin</span>
        </div>

        <div class="legend-item">
          <div class="legend-color both"></div>
          <span>Jirka + Martin</span>
        </div>

        <div class="legend-item">
          <div class="legend-color external"></div>
          <span>Externí osoba</span>
        </div>
      </div>

      <button class="danger-btn" id="clearBtn">Vymazat všechna data</button>
    </aside>

    <main>
      <div class="calendar-header">
        <button class="secondary-btn" id="prevMonthBtn">← Předchozí</button>
        <h1 id="monthTitle"></h1>
        <button class="secondary-btn" id="nextMonthBtn">Další →</button>
      </div>

      <div class="calendar-wrap">
        <div class="calendar" id="calendar"></div>
      </div>
    </main>
  </div>

  <script>
    const monthTitle = document.getElementById("monthTitle");
    const calendar = document.getElementById("calendar");
    const taskList = document.getElementById("taskList");
    const selectedInfo = document.getElementById("selectedInfo");

    const taskNameInput = document.getElementById("taskName");
    const taskPersonSelect = document.getElementById("taskPerson");
    const taskAmountInput = document.getElementById("taskAmount");

    const addTaskBtn = document.getElementById("addTaskBtn");
    const prevMonthBtn = document.getElementById("prevMonthBtn");
    const nextMonthBtn = document.getElementById("nextMonthBtn");
    const clearBtn = document.getElementById("clearBtn");

    const START_YEAR = 2026;
    const START_MONTH = 5;

    let currentYear = START_YEAR;
    let currentMonth = START_MONTH;

    let selectedTaskId = null;

    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
    let calendarItems = JSON.parse(localStorage.getItem("calendarItems")) || [];

    const weekdays = ["Po", "Út", "St", "Čt", "Pá", "So", "Ne"];

    const personLabels = {
      jirka: "Jirka",
      martin: "Martin",
      both: "Jirka + Martin",
      external: "Externí osoba"
    };

    function saveData() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
      localStorage.setItem("calendarItems", JSON.stringify(calendarItems));
    }

    function getDateKey(year, month, day) {
      const m = String(month + 1).padStart(2, "0");
      const d = String(day).padStart(2, "0");
      return `${year}-${m}-${d}`;
    }

    function getCzechMonthName(year, month) {
      const date = new Date(year, month, 1);

      return date.toLocaleDateString("cs-CZ", {
        month: "long",
        year: "numeric"
      });
    }

    function getWeekdayName(year, month, day) {
      const date = new Date(year, month, day);

      return date.toLocaleDateString("cs-CZ", {
        weekday: "short"
      });
    }

    function getMondayBasedDayIndex(date) {
      const day = date.getDay();
      return day === 0 ? 6 : day - 1;
    }

    function updateSelectedInfo() {
      const selectedTask = tasks.find(task => task.id === selectedTaskId);

      if (!selectedTask || selectedTask.remaining <= 0) {
        selectedTaskId = null;
        selectedInfo.classList.remove("active");
        selectedInfo.innerHTML = "";
        return;
      }

      selectedInfo.classList.add("active");
      selectedInfo.innerHTML = `
        Vybráno: <strong>${escapeHtml(selectedTask.name)}</strong><br>
        ${personLabels[selectedTask.person]} · zbývá ${selectedTask.remaining}/${selectedTask.amount}<br>
        Klepni na den v kalendáři.
      `;
    }

    function renderTaskList() {
      taskList.innerHTML = "";

      if (tasks.length === 0) {
        taskList.innerHTML = `<p class="hint">Zatím nejsou přidané žádné úkoly.</p>`;
        updateSelectedInfo();
        return;
      }

      tasks.forEach(task => {
        const taskEl = document.createElement("div");
        taskEl.className = `task ${task.person}`;
        taskEl.draggable = task.remaining > 0;
        taskEl.dataset.taskId = task.id;

        if (task.id === selectedTaskId) {
          taskEl.classList.add("selected");
        }

        if (task.remaining <= 0) {
          taskEl.style.opacity = "0.45";
          taskEl.style.cursor = "not-allowed";
        }

        taskEl.innerHTML = `
          <button class="delete-task-btn" title="Smazat akci" type="button">×</button>
          <strong>${escapeHtml(task.name)}</strong>
          <small>${personLabels[task.person]} · zbývá ${task.remaining}/${task.amount}</small>
        `;

        taskEl.addEventListener("dragstart", event => {
          if (task.remaining <= 0) {
            event.preventDefault();
            return;
          }

          event.dataTransfer.setData("text/plain", task.id);
        });

        taskEl.addEventListener("click", event => {
          if (event.target.classList.contains("delete-task-btn")) {
            return;
          }

          selectTask(task.id);
        });

        const deleteBtn = taskEl.querySelector(".delete-task-btn");

        deleteBtn.addEventListener("click", event => {
          event.stopPropagation();
          deleteTask(task.id);
        });

        taskList.appendChild(taskEl);
      });

      updateSelectedInfo();
    }

    function renderCalendar() {
      calendar.innerHTML = "";
      monthTitle.textContent = getCzechMonthName(currentYear, currentMonth);

      weekdays.forEach(day => {
        const weekdayEl = document.createElement("div");
        weekdayEl.className = "weekday";
        weekdayEl.textContent = day;
        calendar.appendChild(weekdayEl);
      });

      const firstDay = new Date(currentYear, currentMonth, 1);
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const firstDayIndex = getMondayBasedDayIndex(firstDay);

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyEl = document.createElement("div");
        emptyEl.className = "day empty";
        calendar.appendChild(emptyEl);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateKey = getDateKey(currentYear, currentMonth, day);
        const dayEl = document.createElement("div");
        dayEl.className = "day";
        dayEl.dataset.date = dateKey;

        if (selectedTaskId) {
          dayEl.classList.add("can-place");
        }

        dayEl.innerHTML = `
          <div class="day-header">
            <span>${day}</span>
            <span>${getWeekdayName(currentYear, currentMonth, day)}</span>
          </div>
          <div class="day-tasks"></div>
        `;

        dayEl.addEventListener("dragover", event => {
          event.preventDefault();
          dayEl.classList.add("over");
        });

        dayEl.addEventListener("dragleave", () => {
          dayEl.classList.remove("over");
        });

        dayEl.addEventListener("drop", event => {
          event.preventDefault();
          dayEl.classList.remove("over");

          const taskId = event.dataTransfer.getData("text/plain");
          assignTaskToDay(taskId, dateKey);
        });

        dayEl.addEventListener("click", event => {
          if (event.target.closest(".calendar-task")) {
            return;
          }

          if (selectedTaskId) {
            assignTaskToDay(selectedTaskId, dateKey);
          }
        });

        const dayTasksContainer = dayEl.querySelector(".day-tasks");
        const itemsForDay = calendarItems.filter(item => item.date === dateKey);

        itemsForDay.forEach(item => {
          const itemEl = document.createElement("div");
          itemEl.className = `calendar-task ${item.person}`;
          itemEl.innerHTML = `
            ${escapeHtml(item.name)}
            <button title="Odebrat z kalendáře" type="button">×</button>
          `;

          const deleteCalendarBtn = itemEl.querySelector("button");

          deleteCalendarBtn.addEventListener("click", event => {
            event.stopPropagation();
            removeCalendarItem(item.id);
          });

          dayTasksContainer.appendChild(itemEl);
        });

        calendar.appendChild(dayEl);
      }
    }

    function selectTask(taskId) {
      const task = tasks.find(item => item.id === taskId);

      if (!task || task.remaining <= 0) {
        return;
      }

      selectedTaskId = selectedTaskId === taskId ? null : taskId;

      renderTaskList();
      renderCalendar();
    }

    function addTask() {
      const name = taskNameInput.value.trim();
      const person = taskPersonSelect.value;
      const amount = Number(taskAmountInput.value);

      if (!name) {
        alert("Zadej název úkolu.");
        return;
      }

      if (!amount || amount < 1) {
        alert("Časová dotace musí být alespoň 1.");
        return;
      }

      const task = {
        id: crypto.randomUUID(),
        name,
        person,
        amount,
        remaining: amount
      };

      tasks.push(task);

      taskNameInput.value = "";
      taskAmountInput.value = "1";
      taskPersonSelect.value = "jirka";

      saveData();
      renderTaskList();
    }

    function deleteTask(taskId) {
      const task = tasks.find(item => item.id === taskId);

      if (!task) {
        return;
      }

      const confirmed = confirm(
        `Opravdu chceš smazat akci „${task.name}“?\nSmažou se i její výskyty v kalendáři.`
      );

      if (!confirmed) {
        return;
      }

      tasks = tasks.filter(item => item.id !== taskId);
      calendarItems = calendarItems.filter(item => item.sourceTaskId !== taskId);

      if (selectedTaskId === taskId) {
        selectedTaskId = null;
      }

      saveData();
      renderTaskList();
      renderCalendar();
    }

    function assignTaskToDay(taskId, dateKey) {
      const task = tasks.find(item => item.id === taskId);

      if (!task || task.remaining <= 0) {
        return;
      }

      const calendarItem = {
        id: crypto.randomUUID(),
        sourceTaskId: task.id,
        name: task.name,
        person: task.person,
        date: dateKey
      };

      calendarItems.push(calendarItem);
      task.remaining -= 1;

      if (task.remaining <= 0 && selectedTaskId === task.id) {
        selectedTaskId = null;
      }

      saveData();
      renderTaskList();
      renderCalendar();
    }

    function removeCalendarItem(itemId) {
      const item = calendarItems.find(calendarItem => calendarItem.id === itemId);

      if (!item) {
        return;
      }

      const sourceTask = tasks.find(task => task.id === item.sourceTaskId);

      if (sourceTask) {
        sourceTask.remaining += 1;
      }

      calendarItems = calendarItems.filter(calendarItem => calendarItem.id !== itemId);

      saveData();
      renderTaskList();
      renderCalendar();
    }

    function goToPreviousMonth() {
      const isAtStart =
        currentYear === START_YEAR &&
        currentMonth === START_MONTH;

      if (isAtStart) {
        alert("Kalendář začíná v červnu 2026.");
        return;
      }

      currentMonth--;

      if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
      }

      renderCalendar();
    }

    function goToNextMonth() {
      currentMonth++;

      if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
      }

      renderCalendar();
    }

    function clearAllData() {
      const confirmed = confirm("Opravdu chceš vymazat všechny úkoly i položky v kalendáři?");

      if (!confirmed) {
        return;
      }

      tasks = [];
      calendarItems = [];
      selectedTaskId = null;

      saveData();
      renderTaskList();
      renderCalendar();
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    addTaskBtn.addEventListener("click", addTask);
    prevMonthBtn.addEventListener("click", goToPreviousMonth);
    nextMonthBtn.addEventListener("click", goToNextMonth);
    clearBtn.addEventListener("click", clearAllData);

    taskNameInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        addTask();
      }
    });

    renderTaskList();
    renderCalendar();
  </script>
</body>
</html>
